<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
        a { color: #1769aa; }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html">← Back to Dashboard</a>
        <h1 id="title">Loading blog...</h1>
        <p id="content"></p>
        <p id="author"></p>
        <p id="error" style="color:red;"></p>
    </div>

    <script>
        async function loadBlog() {
            const id = new URLSearchParams(window.location.search).get("id");

            if (!id) {
                document.getElementById("error").textContent =
                    "Blog ID is missing.";
                return;
            }

            try {
                const response = await fetch(
                    "http://localhost:3000/blogs/" + encodeURIComponent(id)
                );

                const blog = await response.json();

                if (!response.ok) {
                    throw new Error(blog.message || "Blog not found.");
                }

                document.getElementById("title").textContent = blog.title;
                document.getElementById("content").textContent = blog.content;
                document.getElementById("author").textContent =
                    "Author: " + (blog.author || "Anonymous");
            } catch (error) {
                document.getElementById("title").textContent =
                    "Unable to load blog";
                document.getElementById("error").textContent = error.message;
            }
        }

        window.addEventListener("DOMContentLoaded", loadBlog);
    </script>
</body>
</html>
