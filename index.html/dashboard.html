<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .blog-card {
            background: white;
            padding: 18px;
            margin: 16px 0;
            border-radius: 8px;
            box-shadow: 0 1px 5px #00000018;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #message {
            color: red;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-blog.html">Create Blog</a>
        <button type="button" id="logoutButton">Logout</button>
    </nav>

    <div class="container">

        <div class="topbar">
            <div>
                <h1>My Dashboard</h1>
                <p id="welcome">Loading profile...</p>
            </div>

            <a href="create-blog.html">
                <button type="button">Create New Blog</button>
            </a>
        </div>

        <h2>My Blogs</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search your blogs..."
        >

        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
            <option value="Programming">Programming</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Travel">Travel</option>
        </select>

        <p id="message"></p>

        <div id="blogList">
            Loading blogs...
        </div>

    </div>

    <script>

        const token = localStorage.getItem("token");

        const blogList = document.getElementById("blogList");
        const message = document.getElementById("message");

        // Check login
        if (!token) {
            window.location.replace("login.html");
        }

        // Authorization header
        function authHeaders() {
            return {
                "Authorization": "Bearer " + token
            };
        }

        // Logout
        function logout() {

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.replace("login.html");
        }

        // Load user profile
        async function loadProfile() {

            const response = await fetch("/profile", {
                headers: authHeaders()
            });

            const data = await response.json();

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error(data.message || "Could not load profile");
            }

            document.getElementById("welcome").textContent =
                "Welcome, " + data.user.name +
                " (" + data.user.email + ")";
        }

        // Load logged-in user's blogs
        async function loadBlogs() {

            message.textContent = "";
            blogList.textContent = "Loading blogs...";

            const params = new URLSearchParams();

            const search =
                document.getElementById("searchInput").value.trim();

            const category =
                document.getElementById("categoryFilter").value;

            if (search) {
                params.set("search", search);
            }

            if (category) {
                params.set("category", category);
            }

            try {

                const response = await fetch(
                    "/blogs?" + params.toString(),
                    {
                        headers: authHeaders()
                    }
                );

                const blogs = await response.json();

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        blogs.message || "Could not load blogs"
                    );
                }

                blogList.innerHTML = "";

                if (blogs.length === 0) {
                    blogList.textContent =
                        "No blogs found. Create your first blog!";
                    return;
                }

                blogs.forEach(function (blog) {

                    const card = document.createElement("div");
                    card.className = "blog-card";

                    const title = document.createElement("h3");
                    title.textContent = blog.title;

                    const categoryText = document.createElement("p");
                    categoryText.textContent =
                        "Category: " + blog.category;

                    const content = document.createElement("p");

                    content.textContent =
                        blog.content.length > 180
                            ? blog.content.substring(0, 180) + "..."
                            : blog.content;

                    const detailsLink = document.createElement("a");

                    detailsLink.href =
                        "blog-details.html?id=" +
                        encodeURIComponent(blog._id);

                    detailsLink.textContent = "Read more";

                    const actions = document.createElement("div");
                    actions.className = "actions";

                    // Edit button
                    const editButton = document.createElement("button");

                    editButton.type = "button";
                    editButton.textContent = "Edit";

                    editButton.addEventListener("click", function () {
                        editBlog(blog);
                    });

                    // Delete button
                    const deleteButton = document.createElement("button");

                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener("click", function () {
                        deleteBlog(blog._id);
                    });

                    actions.append(editButton, deleteButton);

                    card.append(
                        title,
                        categoryText,
                        content,
                        detailsLink,
                        actions
                    );

                    blogList.appendChild(card);

                });

            } catch (error) {

                blogList.textContent = "";
                message.textContent = error.message;

            }
        }

        // Edit blog
        async function editBlog(blog) {

            const title = prompt(
                "Enter new blog title:",
                blog.title
            );

            if (title === null) return;

            const content = prompt(
                "Enter new blog content:",
                blog.content
            );

            if (content === null) return;

            const category = prompt(
                "Enter category: Technology, Education, Programming, Lifestyle, Travel",
                blog.category
            );

            if (category === null) return;

            try {

                const response = await fetch(
                    "/blogs/" + encodeURIComponent(blog._id),
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json",
                            ...authHeaders()
                        },

                        body: JSON.stringify({
                            title,
                            content,
                            category
                        })
                    }
                );

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    alert(data.message || "Update failed");
                    return;
                }

                alert("Blog updated successfully!");

                loadBlogs();

            } catch (error) {

                alert("Server connection failed.");

            }
        }

        // Delete blog
        async function deleteBlog(id) {

            if (!confirm("Are you sure you want to delete this blog?")) {
                return;
            }

            try {

                const response = await fetch(
                    "/blogs/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        headers: authHeaders()
                    }
                );

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    alert(data.message || "Delete failed");
                    return;
                }

                alert("Blog deleted successfully!");

                loadBlogs();

            } catch (error) {

                alert("Server connection failed.");

            }
        }

        // Button and filters
        document.getElementById("logoutButton")
            .addEventListener("click", logout);

        document.getElementById("searchInput")
            .addEventListener("input", loadBlogs);

        document.getElementById("categoryFilter")
            .addEventListener("change", loadBlogs);

        // Start dashboard
        if (token) {

            loadProfile()
                .then(loadBlogs)
                .catch(function (error) {
                    message.textContent = error.message;
                });

        }

    </script>

</body>
</html>
